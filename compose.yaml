name: pos-cua-hang-tien-loi

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQLSERVER_SA_PASSWORD:?Set SQLSERVER_SA_PASSWORD in .env}
      MSSQL_MEMORY_LIMIT_MB: "2048"
    ports:
      - "127.0.0.1:14330:1433"
    volumes:
      - pos-sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q 'SELECT 1' -o /dev/null"]
      interval: 3s
      timeout: 10s
      retries: 40
      start_period: 15s

volumes:
  pos-sqlserver-data:
